name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts + tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  e2e:
    name: Local chain end-to-end (seed + CLI + headless UI)
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix frontend ci
      - run: npx hardhat compile && npm --prefix frontend run build
      - name: Start Hardhat node
        run: |
          npx hardhat node > node.log 2>&1 &
          node scripts/wait-for-rpc.js http://127.0.0.1:8545 90
      - run: npm run seed:local
      - run: node scripts/interact.js list
      - name: Serve frontend
        run: |
          npm --prefix frontend run preview > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/deployment.json > /dev/null && break; sleep 1; done
      - name: Headless UI smoke test
        env:
          BASE_URL: http://127.0.0.1:4173
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm --prefix frontend run smoke

  docker:
    name: Docker demo image
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check RPC chain id and seeded data
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            http://127.0.0.1:8545 | grep -q '"0x7a69"'
          curl -s http://127.0.0.1:4173/deployment.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);if(d.chainId!==31337||d.escrows.length!==8)process.exit(1);console.log("8 seeded escrows on chain",d.chainId)})'
          curl -sf http://127.0.0.1:4173/ | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
